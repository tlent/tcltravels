spring.application.name=tcltravels

# Connection Settings
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tcltravels}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Initialization Logic
# This ensures Spring Boot runs your schema.sql on startup
spring.sql.init.mode=always

# This prevents Hibernate from trying to create its own tables
# so that your manual SQL remains the "Source of Truth"
spring.jpa.hibernate.ddl-auto=none

# Logging - This will print the SQL being executed to your console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# REQUIRED: Set JWT_SECRET environment variable to a secure random string (minimum 32 characters)
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# CORS Configuration (Development)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
