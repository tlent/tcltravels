spring.datasource.url=jdbc:h2:mem:tcltravels-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# JWT configuration for tests
jwt.secret=test-secret-key-for-jwt-tokens-minimum-256-bits-long-for-security
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# CORS configuration for tests
cors.allowed-origins=http://localhost:5173
